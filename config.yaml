# ---------------------------------------------------------------------------
# Watching https://t.me/s/LaPromotion
#
# It is a PUBLIC CHANNEL, so reading it needs no credentials at all -- no bot
# in the group, no account session, no api keys. Just an HTTP GET.
# ---------------------------------------------------------------------------

source: web

telegram:
  channel: "LaPromotion"

# ---------------------------------------------------------------------------
# DELIVERY -- ntfy.sh, a separate app whose only job is these alerts.
# Your Telegram stays muted; this one app you leave loud.
# Free, no account, no signup.
#
#   1. install "ntfy" (App Store / Play Store / F-Droid)
#   2. Subscribe to topic -> paste the topic below
#   3. done -- tapping a notification opens the promo in Telegram
#
# The topic name is the ONLY thing keeping strangers out of it on the public
# server, which is why it is long and random. Do not shorten it. If this repo
# is public, move it to a ${NTFY_TOPIC} secret instead.
# ---------------------------------------------------------------------------
notify_via: ntfy

ntfy:
  topic: "lapromo-rtu6x3uoie2xncx"
  # 5 = max urgency (bypasses some Do Not Disturb), 4 = high, 3 = default
  priority: 4
  # Only if you self-host ntfy, or use an access token on ntfy.sh:
  # server: "https://ntfy.sh"
  # token: ${NTFY_TOKEN}

# Prices are read in any common currency; thresholds below are in R$.
currency_symbol: "R$"
currency_style: eu        # 1.234,56  (use "us" for 1,234.56)

# If state is ever lost, ignore anything older than this so you do not get a
# flood of stale promos. Set 0 to disable the guard.
max_age_hours: 24

# How long to remember a message so it is not re-alerted.
retain_days: 14

# ---------------------------------------------------------------------------
# RULES -- replace these with what you actually want.
# A message alerts if it satisfies ANY rule.
#   any       -> at least one of these must appear   (optional if `all` is set)
#   all       -> every one of these must appear      (optional if `any` is set)
#   none      -> if any of these appear, skip it
#   max_price -> only alert if the cheapest price found is <= this (in R$)
#   min_price -> only alert if the cheapest price found is >= this
#
# Case and accents are ignored ("promocao" matches "Promoção").
# Terms never match mid-word ("tv" hits "TVs" but not "netvibes").
# A price gate SKIPS messages that quote no price at all.
#
# Try changes safely, without touching the network or your state:
#   python3 monitor.py --replay fixtures/sample_messages.json --format text
# ---------------------------------------------------------------------------
rules:
  - name: "iPhone"
    any: ["iphone", "apple"]
    none: ["capinha", "capa", "pelicula", "carregador", "cabo", "fone"]
    max_price: 5000

  - name: "Smart TV 55+"
    all: ["tv"]
    any: ["55", "65", "75"]
    none: ["suporte", "rack"]
    max_price: 3000

  - name: "Videogame"
    any: ["playstation", "ps5", "xbox", "nintendo switch"]
    none: ["jogo", "game pass", "controle", "assinatura"]

  - name: "Anything free"
    any: ["gratis", "de graca", "freebie", "cupom 100%"]
