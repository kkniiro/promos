# ---------------------------------------------------------------------------
# Watching public Telegram channels. Reading them needs no credentials at all
# -- no bot in the group, no account session, no api keys. Just an HTTP GET.
#
# Add more by appending to the list. If one channel goes private or is
# renamed, the others are still checked and a warning names the broken one.
# The same promo cross-posted to both only alerts once, because messages are
# de-duplicated on their text rather than per channel.
# ---------------------------------------------------------------------------

source: web

telegram:
  channels:
    - "LaPromotion"      # https://t.me/s/LaPromotion
    - "lobaopromo"       # https://t.me/s/lobaopromo

# ---------------------------------------------------------------------------
# DELIVERY -- ntfy.sh, a separate app whose only job is these alerts.
# Your Telegram stays muted; this one app you leave loud.
# Free, no account, no signup.
#
#   1. install "ntfy" (App Store / Play Store / F-Droid)
#   2. Subscribe to topic -> paste the topic below
#   3. done -- tapping a notification opens the promo in Telegram
#
# The topic name is the ONLY thing keeping strangers out of it on the public
# server, which is why it is long and random. Do not shorten it. If this repo
# is public, move it to a ${NTFY_TOPIC} secret instead.
# ---------------------------------------------------------------------------
notify_via: ntfy

ntfy:
  topic: "lapromo-rtu6x3uoie2xncx"
  # 5 = max urgency (bypasses some Do Not Disturb), 4 = high, 3 = default
  priority: 4
  # Only if you self-host ntfy, or use an access token on ntfy.sh:
  # server: "https://ntfy.sh"
  # token: ${NTFY_TOKEN}

# Prices are read in any common currency; thresholds below are in R$.
currency_symbol: "R$"
currency_style: eu        # 1.234,56  (use "us" for 1,234.56)

# If state is ever lost, ignore anything older than this so you do not get a
# flood of stale promos. Set 0 to disable the guard.
max_age_hours: 24

# How long to remember a message so it is not re-alerted.
retain_days: 14

# ---------------------------------------------------------------------------
# RULES -- replace these with what you actually want.
# A message alerts if it satisfies ANY rule.
#   any       -> at least one of these must appear   (optional if `all` is set)
#   all       -> every one of these must appear      (optional if `any` is set)
#   none      -> if any of these appear, skip it
#   max_price -> only alert if the cheapest price found is <= this (in R$)
#   min_price -> only alert if the cheapest price found is >= this
#
# Case and accents are ignored ("promocao" matches "Promoção").
# Terms never match mid-word ("tv" hits "TVs" but not "netvibes").
# A price gate SKIPS messages that quote no price at all.
#
# Try changes safely, without touching the network or your state:
#   python3 monitor.py --replay fixtures/sample_messages.json --format text
# ---------------------------------------------------------------------------
#
# No max_price on any rule, deliberately: a price gate also throws away every
# message that quotes no price, which silently loses matches. Add one only
# where you know the promos always show a number, e.g.
#     max_price: 6000
#
rules:
  - name: "Hollyland"
    any: ["hollyland"]

  - name: "Lapela"
    # "lavalier" is the same product under its English name.
    any: ["lapela", "lavalier"]

  - name: "Drone"
    any: ["drone"]

  - name: "Câmera"
    # Accents are ignored, so this also catches "camera" typed without one.
    any: ["camera"]

  - name: "iPhone"
    any: ["iphone"]
    # Accessories are not iPhone deals. Delete this line to catch them too.
    none: ["capinha", "capa", "pelicula", "cabo", "carregador", "suporte"]

  - name: "GoPro"
    any: ["gopro", "go pro", "go-pro"]

  - name: "Monitor"
    # Also matches "monitores". Excludes the mounting arms and cables.
    any: ["monitor"]
    none: ["suporte", "braco", "cabo"]

  - name: "SSD"
    # Also matches "SSDs". "nvme" and "m.2" are the same shelf.
    any: ["ssd", "nvme"]

  - name: "Grátis"
    any: ["gratis", "gratuito", "de graca", "free", "brinde", "cupom 100%"]

  # Fires on any message advertising 50% off or more. Reads an explicit
  # percentage ("70% OFF") or infers one from a "de R$ 200 por R$ 50" pair.
  # Messages that state no discount at all are skipped.
  - name: "50%+ off"
    min_discount: 50

  # "contains" matches anywhere in a word, unlike the other lists -- so this
  # also catches "bugado", "bugou" and "bugzeira". That is the point for
  # price-glitch posts, but it is looser: "bugiganga" would match too.
  - name: "Bug"
    contains: ["bug"]

  # --- Roupas -------------------------------------------------------------
  # Plurals are automatic: "camisa" also matches "camisas", "short" matches
  # "shorts". The `none` list drops women's and kids' listings -- delete that
  # line to catch everything regardless of who it is cut for.
  - name: "Roupas"
    any:
      - "camisa"
      - "camiseta"
      - "blusa"
      - "polo"
      - "regata"
      - "moletom"
      - "casaco"
      - "jaqueta"
      - "colete"
      - "sueter"
      - "cardiga"
      - "agasalho"
      - "corta-vento"
      - "blazer"
      - "terno"
      - "gravata"
      - "calca"
      - "jeans"
      - "bermuda"
      - "short"
      - "tactel"
      - "oversized"
      - "pijama"
      - "cueca"
      - "boxer"
      - "sunga"
      - "meias"          # singular "meia" also means "half" (meia duzia)
    none: ["feminina", "feminino", "infantil", "infantis", "menina", "bebe"]

  # --- Calçados -----------------------------------------------------------
  - name: "Calçados"
    any:
      - "tenis"
      - "sapato"
      - "sapatenis"
      - "chinelo"
      - "sandalia"
      - "papete"
      - "coturno"
      - "botina"
      - "botas"          # singular "bota" collides with the verb: "bota no carrinho"
      - "mocassim"
      - "crocs"
      - "havaianas"
    none: ["feminina", "feminino", "infantil", "infantis", "menina", "bebe"]

  # --- Acessórios ---------------------------------------------------------
  - name: "Acessórios"
    any:
      - "oculos"
      - "bone"
      - "cinto"
      - "carteira"
      - "mochila"
      - "relogio"
      - "pochete"
      - "corrente"
    none: ["feminina", "feminino", "infantil", "infantis", "menina", "bebe"]
