# ---------------------------------------------------------------------------
# What to watch, and what counts as interesting.
# Copy to config.yaml and edit. No credentials belong in this file -- the
# ${...} references are resolved from environment variables / GitHub secrets.
# ---------------------------------------------------------------------------

# How to read the group:
#   user -> through YOUR OWN account. The only option for a group you do not
#           administer, since adding a bot needs admin rights.
#   web  -> scrape https://t.me/s/<channel>. PUBLIC CHANNELS only, zero
#           credentials. Use this if you can -- it is by far the simplest.
#   bot  -> a bot you added to the group. Needs admin rights on the group.
source: user

telegram:
  # --- source: user ---------------------------------------------------------
  # From https://my.telegram.org > API development tools.
  api_id: ${TELEGRAM_API_ID}
  api_hash: ${TELEGRAM_API_HASH}
  # Generated once by tools/login.py. As sensitive as your password.
  session: ${TELEGRAM_SESSION}

  # The group to watch. tools/login.py lists every group you are in with its id.
  # Usually a negative number like -1001234567890.
  chat_id: ""

  # --- source: web ----------------------------------------------------------
  # The public @name, without the @.
  channel: ""

  # --- delivery -------------------------------------------------------------
  # Only needed when notify_via is "bot".
  bot_token: ${TELEGRAM_BOT_TOKEN}
  notify_chat_id: ${TELEGRAM_NOTIFY_CHAT_ID}

# Where alerts land on your phone. Takes one name or a list.
#   ntfy     -> ntfy.sh, a free push app. No account, no signup. BEST CHOICE if
#               your Telegram is muted, since it is a separate app you can leave
#               loud without unmuting a hundred groups.
#   pushover -> Pushover. More polished, $5 one-time.
#   discord  -> a Discord webhook (per-server mute is independent of Telegram).
#   webhook  -> generic JSON POST: Slack, Zapier, Home Assistant, your own app.
#   bot      -> a DM from your own Telegram bot. You do NOT need to add it to
#               any group -- it only ever messages you.
#   saved    -> your own Telegram "Saved Messages". Requires source: user.
#
# Verify whichever you pick with:  python3 monitor.py --test-alert
notify_via: ntfy

ntfy:
  # Anyone who knows this topic can read your alerts on the public server,
  # so make it long and random. `python3 -c "import secrets;
  # print(secrets.token_urlsafe(12))"` is a good source.
  topic: ""
  priority: 4        # 5 = max urgency, 4 = high, 3 = default
  # server: "https://ntfy.sh"     # change only if self-hosting
  # token: ${NTFY_TOKEN}          # only for protected topics

pushover:
  token: ${PUSHOVER_TOKEN}
  user_key: ${PUSHOVER_USER_KEY}

discord:
  webhook_url: ${DISCORD_WEBHOOK_URL}

webhook:
  url: ${WEBHOOK_URL}
  headers: {}

# How many recent messages to pull per poll (source: user).
fetch_limit: 60

# If state is ever lost, ignore anything older than this so you do not get a
# flood of stale promos. Set 0 to disable the guard.
max_age_hours: 24

# How long to remember a message so it is not re-alerted.
retain_days: 14

# ---------------------------------------------------------------------------
# Rules. A message alerts if it satisfies ANY rule.
# Within a rule:
#   any       -> at least one of these must appear   (optional if `all` is set)
#   all       -> every one of these must appear      (optional if `any` is set)
#   none      -> if any of these appear, skip it
#   max_price -> only alert if the cheapest price found is <= this
#   min_price -> only alert if the cheapest price found is >= this
#
# Matching ignores case and accents, so "promocao" matches "Promoção".
# Terms will not match mid-word: "tv" hits "TV" and "TVs" but not "netvibes".
# NOTE: a price gate means messages with NO price are skipped by that rule.
# ---------------------------------------------------------------------------
rules:
  - name: "iPhone"
    any: ["iphone", "apple"]
    none: ["capinha", "capa", "pelicula", "carregador", "cabo", "fone"]
    max_price: 5000

  - name: "Smart TV 55+"
    all: ["tv"]
    any: ["55", "65", "75"]
    none: ["suporte", "rack"]
    max_price: 3000

  - name: "Videogame"
    any: ["playstation", "ps5", "xbox", "nintendo switch"]
    none: ["jogo", "game pass", "controle", "assinatura"]

  - name: "Anything free"
    any: ["gratis", "de graca", "freebie", "cupom 100%"]
