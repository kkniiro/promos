name: promo monitor

# GitHub decides how often a scheduled job STARTS, and in practice throttles
# that to roughly hourly no matter how tight the cron is. So the cron below is
# not the polling rate -- it only relaunches the watcher. The watcher then
# polls every INTERVAL seconds from inside a single job, which is what
# actually determines how quickly a promo reaches your phone.
on:
  schedule:
    - cron: "7 * * * *"        # relaunch hourly; the job itself runs ~55 min
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: watch
        options:
          - watch         # poll on a loop for the whole job (the normal mode)
          - poll          # check once and exit
          - dry-run       # show matches, notify nothing, save nothing
          - test-alert    # send one fake alert to check delivery works
          - dump          # print every message read, to check the reader works
      interval:
        description: "Seconds between polls in watch mode"
        default: "120"

# One watcher at a time. cancel-in-progress must stay false: the hourly cron
# leaves a run pending while the current one works, and that pending run
# starts the moment the watcher exits -- which is what closes the handover gap
# rather than waiting for the next cron.
concurrency:
  group: promo-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    # The hard ceiling is 6h per job. 60 lets the 55-minute watcher finish on
    # its own terms, so the cache-save step below still runs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # telethon is only needed for source: user / notify_via: saved
      - run: pip install pyyaml telethon

      - name: Sanity-check the matcher
        run: |
          python3 monitor.py --self-test
          python3 tests/test_dedupe.py

      # State lives in the Actions cache rather than in git, so the repo does
      # not collect a commit every run. A cache miss is safe: the
      # max_age_hours guard stops an empty state replaying the whole backlog.
      # Cache keys are immutable, so each run writes a new one and restores the
      # most recent via the shared prefix.
      - name: Restore seen-message state
        if: ${{ inputs.mode != 'test-alert' }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: promo-state-${{ github.run_id }}
          restore-keys: promo-state-

      - name: Run
        env:
          # delivery
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          # reading a private group (source: user) -- unused for public channels
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          case "${{ inputs.mode || 'watch' }}" in
            test-alert) python3 monitor.py --test-alert ;;
            dump)       python3 monitor.py --dump --dry-run | tee -a "$GITHUB_STEP_SUMMARY" ;;
            dry-run)    python3 monitor.py --format text --dry-run | tee -a "$GITHUB_STEP_SUMMARY" ;;
            poll)       python3 monitor.py --format text --notify --github-output | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *)          python3 monitor.py \
                          --watch "${{ inputs.interval || '120' }}" \
                          --max-runtime 3300 \
                          --format text --notify --quiet \
                          | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac

      # Runs even if the watcher was cancelled, so a manual stop still keeps
      # what it had already seen and does not re-alert it on the next start.
      - name: Save seen-message state
        if: ${{ always() && inputs.mode != 'dry-run' && inputs.mode != 'test-alert' }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: promo-state-${{ github.run_id }}
